<!DOCTYPE html>
<html>
<head>
    <title>Intertek Visitor Sign-In</title>

    <style>
        body {
            background-color: #FFD100;
            background-image: url("intertek-logo.png");
            background-repeat: no-repeat;
            background-position: center;
            background-size: 350px;
        }

        form {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            width: 350px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h2>Visitor Sign-In Form</h2>

 <form onsubmit="submitForm(event)">

        <label>First Name:</label><br>
        <input type="text" name="FirstName" required><br><br>

        <label>Last Name:</label><br>
        <input type="text" name="LastName" required><br><br>

        <label>Enter the date of visit to Intertek Lab?</label><br>
        <input type="date" name="Date" required><br><br>

        <label>Phone Number:</label><br>
        <input type="text" name="Phone" required><br><br>

        <label>Company Name:</label><br>
        <input type="text" name="Company" required><br><br>

        <label>Email Address:</label><br>
        <input type="email" name="Email" required><br><br>

        <label>Name of the Intertek contact or testing department?</label><br>
        <input type="text" name="IntertekContact" required><br><br>

        <label>Have you watched the safety video earlier?</label><br>
        <input type="radio" name="WatchedVideo" value="Yes" required> Yes<br>
        <input type="radio" name="WatchedVideo" value="No" required> No<br><br>

        <button type="submit">Submit</button>

    </form>
<script>
function submitForm(event) {
    event.preventDefault();

    const data = {
        FirstName: document.querySelector("[name='FirstName']").value,
        LastName: document.querySelector("[name='LastName']").value,
        Date: document.querySelector("[name='Date']").value,
        Phone: document.querySelector("[name='Phone']").value,
        Company: document.querySelector("[name='Company']").value,
        Email: document.querySelector("[name='Email']").value,
        IntertekContact: document.querySelector("[name='IntertekContact']").value,
        WatchedVideo: document.querySelector("[name='WatchedVideo']:checked").value
    };

    fetch("https://defaultcec3b02aea8c40eda66fa89023ac32.86.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/e05edf43f04b47c9adacf4dd2dbd2b02/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Su4JVV7UkHCBQXqrbLsW2663hIhclRaB5kkTfKFwgrA", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    })
    .then(() => {
    // Replace the entire page with your custom message
    document.body.innerHTML = `
        <h1 style="font-family: Arial; text-align:center; margin-top: 100px;">
            Thank you signing in with Intertek.
        </h1>
        <p style="text-align:center; font-size:20px; margin-top: 10px;">
            Safety First. Have a great day.
        </p>
    `;

})
.catch(() => alert("Error submitting form"));

}
</script>
</body>
</html>
